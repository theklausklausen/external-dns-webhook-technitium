apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns-webhook-technitium
  namespace: external-dns
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: external-dns-webhook-technitium
  namespace: external-dns
data:
  TECHNITIUM_URL: "http://technitium-dns.external-dns.svc.cluster.local:5380"
  TECHNITIUM_USER: "admin"
  LOG_LEVEL: "DEBUG"
  LOG_FORMAT: "text"
  WEBHOOK_ADDR: ":8888"
---
apiVersion: v1
kind: Secret
metadata:
  name: external-dns-webhook-technitium
  namespace: external-dns
type: Opaque
stringData:
  TECHNITIUM_PASSWORD: "admin"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-webhook-technitium
  namespace: external-dns
  labels:
    app: external-dns-webhook-technitium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-dns-webhook-technitium
  template:
    metadata:
      labels:
        app: external-dns-webhook-technitium
    spec:
      serviceAccountName: external-dns-webhook-technitium
      containers:
      - name: webhook
        image: external-dns-webhook-technitium:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8888
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: external-dns-webhook-technitium
        - secretRef:
            name: external-dns-webhook-technitium
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: external-dns-webhook-technitium
  namespace: external-dns
  labels:
    app: external-dns-webhook-technitium
spec:
  type: ClusterIP
  ports:
  - port: 8888
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: external-dns-webhook-technitium
