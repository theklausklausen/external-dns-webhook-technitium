#   stage: test
#   image: golangci/golangci-lint:v1.62.2
#   script:
#     - golangci-lint run -v
#   allow_failure: true

# go-test:
#   stage: test
#   image: $GO_IMAGE
#   script:
#     - go test -v ./...

# lint
markdown lint:
  extends: .markdown_lint
  <<: *only_on_markdown_change
yaml lint:
  extends: .yaml_lint
  <<: *only_on_yaml_change
prettier lint:
  extends: .prettier
helm lint:
  extends: .helm_lint
  variables:
    HELM_CHART_DIR: charts/
    PACKAGE_NAME: external-dns-webhook-technitium
  <<: *only_on_helm_change
go-lint:
  extends: .go_lint
  <<: *only_on_code_change

# test
render helm chart:
  extends: .render_helm_chart
  variables:
    HELM_CHART_DIR: charts/
    PACKAGE_NAME: external-dns-webhook-technitium
  <<: *only_on_helm_change

test:
  stage: test
  image: $GO_IMAGE
  script:
    - echo "Running tests..."
    - go test -v ./...
  <<: *only_on_code_change

e2e test:
  stage: test
  image: $GO_IMAGE
  services:
    - name: technitium/dns-server:latest
      alias: technitium
  variables:
    DNS_SERVER_DOMAIN: dns-server
    DNS_SERVER_ADMIN_PASSWORD: admin
    E2E_TECHNITIUM_URL: http://technitium:5380
    E2E_TECHNITIUM_USER: admin
    E2E_TECHNITIUM_PASSWORD: admin
    E2E_WEBHOOK_URL: http://127.0.0.1:8888
    E2E_DNS_SERVER: technitium
    E2E_DNS_PORT: "53"
    E2E_ZONE: e2e.local
  script:
    - apt-get update && apt-get install -y --no-install-recommends curl dnsutils ca-certificates
    - cd "$CI_PROJECT_DIR"
    - go build -o /tmp/webhook ./cmd/webhook
    - TECHNITIUM_URL=$E2E_TECHNITIUM_URL TECHNITIUM_USER=$E2E_TECHNITIUM_USER TECHNITIUM_PASSWORD=$E2E_TECHNITIUM_PASSWORD WEBHOOK_ADDR=:8888 DOMAIN_FILTER=$E2E_ZONE LOG_LEVEL=debug /tmp/webhook >/tmp/webhook.log 2>&1 &
    - WEBHOOK_PID=$!
    - trap 'kill $WEBHOOK_PID >/dev/null 2>&1 || true; echo "--- webhook log ---"; cat /tmp/webhook.log || true' EXIT
    - test -f e2e/run.sh || (echo "missing e2e/run.sh in CI workspace" && ls -la && ls -la e2e || true && exit 1)
    - sh e2e/run.sh
  <<: *only_on_code_change
# run_test_suite:
#   stage: test
#   image: golang:1.26
#   script:
#     - TEST_ZONE_NAME=example.com make test
#   <<: *only_on_code_change

# security
secret_detection:
  stage: security
gitlab-advanced-sast:
  stage: security
dependency-scanning:
  stage: security
package_scan:
  extends: .package_scan
container_scan:
  extends: .container_scan
  allow_failure: true

# build
build image:
  extends: .image_multi_arch
  variables:
    IMAGE_NAME: ${NEXUS_REPO_HOST}/${CI_PROJECT_NAME}
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
    BUILD_TARGET: prod
  <<: *only_on_code_change

# package
package image:
  extends: .image_tag
  variables:
    IMAGE_NAME: ${NEXUS_REPO_HOST}/${CI_PROJECT_NAME}
  tags:
    - amd64
  <<: *only_on_code_change
package helm:
  extends: .package_helm_chart
  variables:
    HELM_CHART_DIR: charts/
    PACKAGE_NAME: external-dns-webhook-technitium
  <<: *only_on_helm_change

# deploy
deploy helm:
  extends: .deploy_helm_chart
  variables:
    HELM_CHART_DIR: charts
    PACKAGE_NAME: external-dns-webhook-technitium
  <<: *only_on_helm_change

