# security
secret_detection:
  stage: security
gitlab-advanced-sast:
  stage: security
dependency-scanning:
  stage: security
package_scan:
  extends: .package_scan
container_scan:
  extends: .container_scan
  allow_failure: true

# build
build image:
  extends: .image_multi_arch
  variables:
    IMAGE_NAME: ${NEXUS_REPO_HOST}/${CI_PROJECT_NAME}
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
    BUILD_TARGET: prod
  <<: *only_on_code_change

# package
package image:
  extends: .image_tag
  variables:
    IMAGE_NAME: ${NEXUS_REPO_HOST}/${CI_PROJECT_NAME}
  tags:
    - amd64
  <<: *only_on_code_change
package helm:
  extends: .package_helm_chart
  variables:
    HELM_CHART_DIR: charts/
    PACKAGE_NAME: external-dns-webhook-technitium
  <<: *only_on_helm_change

# deploy
deploy helm:
  extends: .deploy_helm_chart
  variables:
    HELM_CHART_DIR: charts
    PACKAGE_NAME: external-dns-webhook-technitium
  <<: *only_on_helm_change

